AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CPSC Compliance Assistant - one-time infrastructure. EC2 t4g.small (API + Postgres + Caddy),
  S3 + CloudFront (frontend, /api/* routed to EC2), ECR, GitHub OIDC deploy role, $5 budget.

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo allowed to deploy, e.g. zakriyaparacha/cpsc-rag
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set false if the account already has token.actions.githubusercontent.com
  BudgetEmail:
    Type: String
    Description: Email for the $5 AWS Budgets alert
  CloudFrontPrefixList:
    Type: String
    Default: pl-3b927c52
    Description: com.amazonaws.global.cloudfront.origin-facing prefix list id (us-east-1 value)
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  MakeOIDC: !Equals [!Ref CreateOIDCProvider, "true"]
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]

Resources:
  # ---------- Registry and buckets ----------
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cpsc-rag-api
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules":[{"rulePriority":1,"description":"keep last 10","selection":
          {"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  ArtifactBucket: # deploy bundles + raw ingestion copies
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-deploy-bundles
            Prefix: deploy/
            Status: Enabled
            ExpirationInDays: 30

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- EC2 ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: app
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:PutObject]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cpsc-rag/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront only. No SSH - use SSM Session Manager.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t4g.small
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt InstanceSG.GroupId]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: cpsc-rag }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-aarch64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # 1 GB swap: headroom for the 2 GB instance
          dd if=/dev/zero of=/swapfile bs=1M count=1024
          chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          mkdir -p /opt/cpsc-rag

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance

  # ---------- CloudFront: / -> S3, /api/* -> EC2 (same origin, so cookies just work) ----------
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            # EIP-based public DNS (stable across stop/start)
            DomainName: !If
              - IsUsEast1
              - !Sub
                - "ec2-${Dashed}.compute-1.amazonaws.com"
                - Dashed: !Join ["-", !Split [".", !Ref ElasticIP]]
              - !Sub
                - "ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com"
                - Dashed: !Join ["-", !Split [".", !Ref ElasticIP]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            Compress: false # keep SSE streaming unbuffered
        CustomErrorResponses: # SPA fallback for client-side routes
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ---------- GitHub Actions deploy role (OIDC, no stored AWS keys) ----------
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cpsc-rag-github-deploy
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # main-branch jobs, and jobs using the "production" environment
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubRepo}:environment:production"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ApiRepository.Arn
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !GetAtt WebBucket.Arn
                  - !Sub "${WebBucket.Arn}/*"
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"
              - Effect: Allow # retrieval eval on merges to main
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"

  # ---------- Cost guard ----------
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: cpsc-rag-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  AwsRoleArn: { Value: !GetAtt DeployRole.Arn }
  EcrRepository: { Value: !GetAtt ApiRepository.RepositoryUri }
  ArtifactBucket: { Value: !Ref ArtifactBucket }
  WebBucket: { Value: !Ref WebBucket }
  DistributionId: { Value: !Ref Distribution }
  SiteUrl: { Value: !Sub "https://${Distribution.DomainName}" }
  InstanceId: { Value: !Ref Instance }
