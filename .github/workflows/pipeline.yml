# Every push and PR: lint, test and build (no AWS access).
# Push to main, once those pass: deploy that exact commit to the server and smoke-test the site.
# Each check calls the same `make` target a developer runs locally.
name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cpsc, POSTGRES_PASSWORD: cpsc, POSTGRES_DB: cpsc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cpsc" --health-interval 3s --health-retries 20
    env:
      ENV: ci
      LLM_MODE: fake
      DATABASE_URL: postgresql://cpsc:cpsc@localhost:5432/cpsc
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make api-check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-check

  # Native arm64 runner = same CPU as the t4g server.
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: make image IMAGE=cpsc-rag-api:ci
      - run: make image-smoke IMAGE=cpsc-rag-api:ci

  deploy:
    needs: [api-check, web-check, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production # only main may deploy; the AWS role trusts this environment only
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Deploy on the server via SSM
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          # Runs as ec2-user (owner of the repo): update to the tested commit, then deploy.
          CMD="sudo -u ec2-user -H bash -lc 'cd /opt/cpsc-rag && git fetch -q origin main && git reset -q --hard $SHA && scripts/deploy.sh'"
          PARAMS=$(python3 -c 'import json,sys; print(json.dumps({"commands": [sys.argv[1]], "executionTimeout": ["1800"]}))' "$CMD")
          ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
                 --comment "deploy ${SHA:0:7}" --parameters "$PARAMS" --query Command.CommandId --output text)
          echo "SSM command $ID"
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          echo "----- server errors -----"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text
          echo "Status: $STATUS"
          test "$STATUS" = Success

      - name: Public smoke test
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "${{ vars.SITE_URL }}/api/health"; then echo; exit 0; fi
            sleep 6
          done
          exit 1
