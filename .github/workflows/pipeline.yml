# Every push/PR: lint + test + build (no AWS access).
# Push to main: all of the above, then deploy API (ECR -> EC2 via SSM) and web (S3 + CloudFront).
# Each check step calls the same `make` target you run locally.
name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != '' }}

jobs:
  api-check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cpsc, POSTGRES_PASSWORD: cpsc, POSTGRES_DB: cpsc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cpsc" --health-interval 3s --health-retries 20
    env:
      ENV: ci
      LLM_MODE: fake
      DATABASE_URL: postgresql://cpsc:cpsc@localhost:5432/cpsc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make api-check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-check
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist, retention-days: 3 }

  # Native arm64 runner = same arch as t4g, no QEMU. (Free for public repos;
  # for a private repo swap to ubuntu-latest + docker/setup-qemu-action.)
  image:
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, id-token: write }
    outputs:
      uri: ${{ steps.meta.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "uri=${{ vars.ECR_REPOSITORY || 'cpsc-rag-api' }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build -t "${{ steps.meta.outputs.uri }}" api
      - name: Smoke-test image
        run: make image-smoke IMAGE="${{ steps.meta.outputs.uri }}"
      - if: env.DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - if: env.DEPLOY == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - if: env.DEPLOY == 'true'
        run: docker push "${{ steps.meta.outputs.uri }}"

  deploy-api:
    needs: [api-check, web-check, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Upload deploy bundle
        run: |
          aws s3 cp deploy/compose.prod.yml "s3://${{ vars.ARTIFACT_BUCKET }}/deploy/${{ github.sha }}/compose.prod.yml"
          aws s3 cp deploy/Caddyfile        "s3://${{ vars.ARTIFACT_BUCKET }}/deploy/${{ github.sha }}/Caddyfile"
          aws s3 cp scripts/remote-deploy.sh "s3://${{ vars.ARTIFACT_BUCKET }}/deploy/${{ github.sha }}/remote-deploy.sh"
      - name: Deploy on EC2 via SSM
        run: |
          B="${{ vars.ARTIFACT_BUCKET }}"; S="${{ github.sha }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy $S" \
            --parameters "commands=[\"aws s3 cp s3://$B/deploy/$S/remote-deploy.sh /tmp/remote-deploy.sh\",\"bash /tmp/remote-deploy.sh ${{ needs.image.outputs.uri }} $B $S\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text)
          test "$STATUS" = "Success"

  deploy-web:
    needs: [deploy-api]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Sync to S3
        run: |
          # hashed assets cache forever; index.html never
          aws s3 sync dist "s3://${{ vars.WEB_BUCKET }}" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" --cache-control "no-cache"
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths /index.html
      - name: Public smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.SITE_URL }}/api/health" && exit 0
            sleep 6
          done
          exit 1
